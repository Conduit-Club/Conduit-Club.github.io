name: PR 网页预览

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pages-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 获取 PR 代码
        uses: actions/checkout@v4
      - name: 安装 Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true
      - name: 安装依赖
        run: pixi run --locked npm ci
      - name: 构建预览
        run: pixi run --locked build
        env:
          SITE_URL: https://pr-${{ github.event.pull_request.number }}.${{ vars.CLOUDFLARE_PAGES_PROJECT }}.pages.dev
      - name: 保存静态产物
        uses: actions/upload-artifact@v4
        with:
          name: pages-preview
          path: build
          if-no-files-found: error
          retention-days: 7

  preview:
    needs: build
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - name: 下载静态产物
        uses: actions/download-artifact@v4
        with:
          name: pages-preview
          path: site
      - name: 发布独立 PR 预览
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.143.0'
          packageManager: npm
          command: pages deploy site --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=pr-${{ github.event.pull_request.number }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: 输出预览链接
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
        run: |
          printf '## 网页预览\n\n[打开本次预览](%s)\n\n[本 PR 固定入口](%s)\n' "$PREVIEW_URL" "$ALIAS_URL" >> "$GITHUB_STEP_SUMMARY"
