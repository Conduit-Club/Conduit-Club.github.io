name: 发布 Conduit Club Docusaurus 站点

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 获取仓库
        uses: actions/checkout@v4
      - name: 安装 Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true
      - name: 安装 Docusaurus 依赖
        run: pixi run npm ci
      - name: 构建文档站
        run: pixi run build
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: build
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  cloudflare-pages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
      PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
      PAGES_BRANCH: ${{ github.ref_name }}
    steps:
      - name: 获取仓库
        uses: actions/checkout@v4
      - name: 检查 Pages 发布配置
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$PAGES_PROJECT"
      - name: 安装 Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true
      - name: 安装 Docusaurus 依赖
        run: pixi run --locked npm ci
      - name: 构建自定义域名站点
        run: pixi run --locked build
        env:
          SITE_URL: https://www.shoumc.com
      - name: 发布到 Cloudflare Pages
        run: >-
          pixi run --locked --environment cloudflare
          npx --yes wrangler@4.143.0 pages deploy build
          --project-name "$PAGES_PROJECT" --branch "$PAGES_BRANCH"
