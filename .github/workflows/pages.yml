name: 发布 Conduit Club Docusaurus 站点

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 获取仓库
        uses: actions/checkout@v4
      - name: 安装 Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true
      - name: 安装 Docusaurus 依赖
        run: pixi run npm ci
      - name: 构建文档站
        run: pixi run build
      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5
      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: build
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
